# Fantasy Football Draft Bot Configuration

# League Settings
league:
  scoring_type: "ppr"  # Options: ppr, half_ppr, standard
  team_count: 12
  roster_positions:
    qb: 1
    rb: 2
    wr: 3
    te: 1
    flex: 1   # RB/WR/TE eligible
    bench: 8
  # K and DST are not modeled

# Scoring Rules (PPR)
scoring:
  passing:
    yards_per_point: 25
    td: 4
    interception: -2
    two_point_conversion: 2
  rushing:
    yards_per_point: 10
    td: 6
    two_point_conversion: 2
  receiving:
    yards_per_point: 10
    td: 6
    reception: 1  # PPR
    two_point_conversion: 2

# Data Settings
data:
  seasons: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

# Model Settings
model:
  walk_forward_folds: 10   # min 6 train seasons per fold
  random_state: 42
  optuna_trials: 100

# Draft Settings
draft:
  pick_position: 1  # 1-12, set before draft
  snake_draft: true
  replacement_levels:
    qb: 12
    rb: 29
    wr: 41
    te: 12
